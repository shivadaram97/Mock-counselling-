function note(t){const m=$("msg");m.textContent=t;m.classList.toggle("hide",!t)}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return "x"+h}}
function findC(r){r=String(r).replace(/\D/g,"");if(r.length<6)return null;return C.find(c=>c.reg.endsWith(r.slice(-6)))}
function allot(){const left=K.map(k=>k.s),res={},by=K.map(()=>[]);
for(const c of C){const d=docs[c.reg];if(!d||!Array.isArray(d.p))continue;
for(const k of d.p){if(Number.isInteger(k)&&K[k]&&left[k]>0){left[k]--;res[c.reg]=k;by[k].push(c);break}}}
return{res,by,left}}

else await db.collection("cand").doc(c.reg).set({h,p:[],t:Date.now()});

$("st").textContent=open?"Options open. Allotment updates live as everyone saves.":"Options closed. Result below is final.";
$("save").disabled=!open||!dirty;

$("board").innerHTML=K.map((c,j)=>{const b=A.by[j];return '<div class="c"><b>'+c.n+'</b> <span class="mu">· '+b.length+'/'+c.s+' filled'+(b.length?' · last rank '+(b[b.length-1].i+1):'')+'</span>'+b.map(x=>'<div class="r"><span class="n">'+(x.i+1)+'</span><span class="t'+(x.reg===me.reg?' me':'')+'">'+x.name+'</span></div>').join("")+'</div>'}).join("")}
function mv(j,o){const t=j+o;if(t<0||t>=mine.length)return;[mine[j],mine[t]]=[mine[t],mine[j]];dirty=true;render()}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset;
if(D.a!==undefined){mine.push(+D.a);dirty=true;render()}
else if(D.x!==undefined){mine.splice(+D.x,1);dirty=true;render()}
